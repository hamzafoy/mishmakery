backend:
  name: git-gateway
  repo: hamzafoy/mishmakery
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: "AUTH_ENDPOINT"
  auth_token_endpoint: "AUTH_TOKEN_ENDPOINT"
  gateway_url: https://gateway.decapbridge.com

media_library:
  name: cloudinary
  config:
    cloud_name: "dynxatbex"
    api_key: "CLOUDINARY_API_KEY"
    api_secret: "CLOUDINARY_API_SECRET"
    folder: "mishmakery"
    upload_preset: decap_unsigned

media_folder: ""      # With cloudinary, leave blank
public_folder: ""     # With cloudinary, leave blank

collections:
  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }
  - name: "bakery_menu"
    label: "Bakery Menu"
    file: "public/content/bakery_menu.json"
    folder: "content/bakery_menu"
    fields:
      - label: "Custom Cakes"
        name: "customCakes"
        widget: "object"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Note", name: "note", widget: "string", required: false }

      - label: "Other Desserts"
        name: "otherDesserts"
        widget: "object"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Details"
                name: "details"
                widget: "list"
                field: { label: "Detail", name: "detail", widget: "string" }

      - label: "Custom Cake Flavors"
        name: "flavors"
        widget: "object"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Items"
            name: "items"
            widget: "list"
            field: { label: "Flavor", name: "flavor", widget: "string" }
          - { label: "Additional Message", name: "additionalMessage", widget: "string" }