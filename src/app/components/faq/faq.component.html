<div class="faq-container py-4">
  <mat-card appearance="outlined" class="mx-4 faq-card">
      <mat-card-header>
        <mat-card-title class="mx-2">
          {{ frequentlyAskedQuestions?.title }}
        </mat-card-title>
      </mat-card-header>
      <mat-divider class="mt-4 mb-2 mx-4"></mat-divider>
      <mat-card-content class="mx-4">
        <div *ngFor="let qna of frequentlyAskedQuestions?.questions" class="question-container d-flex flex-column my-4">
          <span class="question-answer-span" matBadge="Q" matBadgeSize="large" matBadgePosition="before" matBadgeOverlap="false">{{ qna.question }}</span>
          <span class="question-answer-span" matBadge="A" matBadgeSize="large" matBadgePosition="before" matBadgeOverlap="false">{{ qna.answer }}</span>
        </div>
      </mat-card-content>
    </mat-card>
</div>
